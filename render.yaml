services:
  - type: web
    name: meridian-house-brms
    runtime: node
    plan: starter
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: meridian-sqlite-data
      mountPath: /var/data
      sizeGB: 1
